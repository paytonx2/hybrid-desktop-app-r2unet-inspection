name: CD - Build & Release Desktop App

# Runs automatically when you push a tag like "v1.0.0"
#   git tag v1.0.0
#   git push origin v1.0.0
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build .exe with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name "R2UNET_Inspection_Pro" `
            main.py

      - name: Zip the build output
        run: Compress-Archive -Path dist/R2UNET_Inspection_Pro/* -DestinationPath R2UNET_Inspection_Pro-${{ github.ref_name }}-windows.zip

      - name: Upload artifact (for debugging every run)
        uses: actions/upload-artifact@v4
        with:
          name: R2UNET_Inspection_Pro-windows
          path: R2UNET_Inspection_Pro-${{ github.ref_name }}-windows.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: R2UNET_Inspection_Pro-${{ github.ref_name }}-windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The web dashboard does NOT need a step here: once you connect the repo
  # to Vercel, Vercel deploys it automatically on every push to main.
  # This job just documents that this pipeline is deliberately decoupled.
  note-about-dashboard:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Dashboard deploys are handled by Vercel's own Git integration, not this workflow."
