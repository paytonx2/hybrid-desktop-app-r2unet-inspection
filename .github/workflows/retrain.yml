name: CT - Retrain & Evaluate Candidate Model

# Manually triggered from the Actions tab (Run workflow button).
# Not on a schedule/push, on purpose: retraining should be a deliberate
# decision, and the resulting candidate model still needs a human to look
# at the evaluation gate result before it ever reaches models/ in production.
#
# One-time setup (see CICTCD_SETUP.md, Part 6):
#   - "models-v1" release with both production .h5 files (same one the
#     CD workflow uses)
#   - "dataset-v1" release with defect_dataset.zip and/or
#     tank_screw_dataset.zip: one AutoVI category each, zipped so that
#     train/, test/ and ground_truth/ are at the top level of the zip
#     (see training/README.md)
on:
  workflow_dispatch:
    inputs:
      model_target:
        description: 'Which model to retrain'
        required: true
        default: 'defect'
        type: choice
        options:
          - defect
          - tank_screw
      epochs:
        description: 'Max training epochs (EarlyStopping usually stops earlier)'
        required: false
        default: '80'

env:
  MODELS_RELEASE_TAG: models-v1
  DATASET_RELEASE_TAG: dataset-v1

jobs:
  retrain-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements*.txt

      - name: Install system libs required by OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve production model filename
        id: model
        run: |
          # Must match core/model_manager.py default_paths()
          case "${{ inputs.model_target }}" in
            defect)     echo "file=defect_model.h5" >> "$GITHUB_OUTPUT" ;;
            tank_screw) echo "file=r2unet__model_underbody_screw.h5" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Download current production model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$MODELS_RELEASE_TAG" --pattern "${{ steps.model.outputs.file }}" --dir models --clobber \
            || { echo "::error::Upload ${{ steps.model.outputs.file }} to the '$MODELS_RELEASE_TAG' GitHub Release first (CICTCD_SETUP.md Part 5)."; exit 1; }

      - name: Fetch dataset (AutoVI layout)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip_name="${{ inputs.model_target }}_dataset.zip"
          data_dir="training/data/${{ inputs.model_target }}"
          gh release download "$DATASET_RELEASE_TAG" --pattern "$zip_name" --dir /tmp/dataset \
            || { echo "::error::Upload $zip_name to the '$DATASET_RELEASE_TAG' GitHub Release first (CICTCD_SETUP.md Part 6)."; exit 1; }
          mkdir -p "$data_dir"
          unzip -q "/tmp/dataset/$zip_name" -d "$data_dir"
          for d in train/good test/good test/missing ground_truth/missing; do
            [ -d "$data_dir/$d" ] || { echo "::error::$zip_name must contain $d/ at its top level (see training/README.md)."; exit 1; }
          done
          echo "missing images: $(ls "$data_dir/test/missing" | wc -l), good: $(ls "$data_dir/train/good" | wc -l) train + $(ls "$data_dir/test/good" | wc -l) test"

      - name: Retrain candidate model
        run: |
          python training/retrain.py \
            --data-dir training/data/${{ inputs.model_target }} \
            --epochs ${{ inputs.epochs }} \
            --output training/output/candidate_${{ steps.model.outputs.file }}

      - name: Evaluate candidate vs current production model (gate)
        run: |
          python training/evaluate.py \
            --current models/${{ steps.model.outputs.file }} \
            --candidate training/output/candidate_${{ steps.model.outputs.file }} \
            --data-dir training/data/${{ inputs.model_target }} \
            --report training/output/evaluation.json

      - name: Upload candidate model and reports for human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ inputs.model_target }}-model
          path: |
            training/output/candidate_${{ steps.model.outputs.file }}
            training/output/evaluation.json
            training/output/history.csv
            training/output/split.csv
          if-no-files-found: warn

      # NOTE: there is deliberately no step here that copies the candidate
      # into models/ and pushes it. Promoting a model to production is a
      # manual decision: download the artifact above, verify it yourself,
      # then upload it to the models release and go through the normal CD
      # release flow.
