name: CI

# Desktop app tests. The dashboard has its own workflow (dashboard-ci.yml)
# so that dashboard-only changes still get build-checked.
on:
  push:
    branches: [main, dev]
    paths-ignore:
      - 'dashboard/**'
      - '**.md'
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - 'dashboard/**'
      - '**.md'

jobs:
  test-desktop-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements*.txt

      - name: Install system libs required by OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest tests/ -v
